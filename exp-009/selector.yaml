apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: {name: experiment, namespace: np9-main}
spec:
  podSelector: {matchLabels: {app: server}}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: other}}
        - namespaceSelector: {matchLabels: {kubernetes.io/metadata.name: np9-other}}
          podSelector: {matchLabels: {app: client}}
