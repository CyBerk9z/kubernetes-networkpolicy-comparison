# EXP-004 共通ワークロード（4クラスタに同一のものを適用）
#  server  : 受信側。TCP 80(名前 http) と 81(名前 alt) で待ち受け（agnhost netexec）
#  client-a: 同じ ns, app=client   / client-b: 同じ ns, app=other
#  client-c: 別 ns(np9-other, team=x), app=client
# 送信は `agnhost connect` を使う（成功 / TIMEOUT=破棄 / REFUSED=拒否 を区別できる）
apiVersion: v1
kind: Namespace
metadata: {name: np9-main, labels: {team: main}}
---
apiVersion: v1
kind: Namespace
metadata: {name: np9-other, labels: {team: x}}
---
apiVersion: v1
kind: Pod
metadata: {name: server, namespace: np9-main, labels: {app: server}}
spec:
  containers:
    - name: p80
      image: registry.k8s.io/e2e-test-images/agnhost:2.53
      args: ["netexec", "--http-port=80", "--udp-port=-1"]
      ports: [{name: http, containerPort: 80}]
    - name: p81
      image: registry.k8s.io/e2e-test-images/agnhost:2.53
      args: ["netexec", "--http-port=81", "--udp-port=-1"]
      ports: [{name: alt, containerPort: 81}]
---
apiVersion: v1
kind: Service
metadata: {name: server, namespace: np9-main}
spec:
  selector: {app: server}
  ports: [{port: 80, targetPort: 80}]
---
apiVersion: v1
kind: Pod
metadata: {name: client-a, namespace: np9-main, labels: {app: client}}
spec:
  containers:
    - name: c
      image: registry.k8s.io/e2e-test-images/agnhost:2.53
      args: ["pause"]
---
apiVersion: v1
kind: Pod
metadata: {name: client-b, namespace: np9-main, labels: {app: other}}
spec:
  containers:
    - name: c
      image: registry.k8s.io/e2e-test-images/agnhost:2.53
      args: ["pause"]
---
apiVersion: v1
kind: Pod
metadata: {name: client-c, namespace: np9-other, labels: {app: client}}
spec:
  containers:
    - name: c
      image: registry.k8s.io/e2e-test-images/agnhost:2.53
      args: ["pause"]

